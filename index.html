<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jane Voss | Hiking</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #d8c59b;
      --accent-soft: rgba(216, 197, 155, 0.28);
      --ink: #ffffff;
      --muted: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.38);
      --glass: rgba(255, 255, 255, 0.14);
      --glass-strong: rgba(255, 255, 255, 0.2);
      --shadow: rgba(0, 0, 0, 0.38);
      --panel-max: 520px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #070707;
    }

    body {
      min-height: 320vh;
      margin: 0;
      color: var(--ink);
      background: #070707;
      overflow-x: hidden;
    }

    button,
    a {
      font: inherit;
    }

    .stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: #070707;
    }

    .stage__poster,
    .stage__video,
    .stage__image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .stage__poster {
      background-image: var(--poster);
      background-position: center;
      background-size: cover;
      filter: blur(24px) saturate(1.05);
      opacity: 0.64;
      transform: scale(1.08);
      transition: opacity 260ms ease;
    }

    .video-ready .stage__poster {
      opacity: 0.72;
    }

    .stage__video {
      object-fit: contain;
      object-position: center;
      background: transparent;
      opacity: 0;
      transition: opacity 260ms ease;
      will-change: opacity;
    }

    .video-ready .stage__video {
      opacity: 1;
    }

    .stage__image {
      background-image: var(--image);
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      opacity: 0;
      transition: opacity 260ms ease;
      will-change: opacity;
    }

    .stage__image.is-active {
      opacity: 1;
    }

    .video-ready .stage__image {
      opacity: 0;
    }

    .stage__veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.58) 0%, rgba(0, 0, 0, 0.34) 44%, rgba(0, 0, 0, 0.12) 100%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.22) 0%, rgba(0, 0, 0, 0.05) 44%, rgba(0, 0, 0, 0.58) 100%);
      pointer-events: none;
    }

    .shell {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 24px;
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: auto;
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      color: #fff;
      text-decoration: none;
    }

    .mark__mountain {
      width: 54px;
      height: 34px;
      flex: 0 0 auto;
    }

    .mark__word {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      line-height: 1;
      white-space: nowrap;
      letter-spacing: 0;
    }

    .design-switcher {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      width: min(100%, 380px);
      border: 1px solid var(--line);
      background: rgba(10, 10, 10, 0.36);
      backdrop-filter: blur(18px);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 18px 44px var(--shadow);
    }

    .design-switcher button {
      min-width: 0;
      height: 42px;
      border: 0;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .design-switcher button:last-child {
      border-right: 0;
    }

    .design-switcher button[aria-pressed="true"] {
      color: #111;
      background: var(--accent);
    }

    .menu-button {
      display: none;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      cursor: pointer;
    }

    .menu-button svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    .content {
      align-self: center;
      width: min(100%, var(--panel-max));
      padding-top: 26px;
      pointer-events: auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 1px;
      background: currentColor;
      opacity: 0.85;
    }

    h1 {
      width: min-content;
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 5.5rem;
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    .subtitle {
      max-width: 330px;
      margin: 0 0 38px;
      color: rgba(255, 255, 255, 0.88);
      font-size: 1.28rem;
      line-height: 1.32;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.36);
    }

    .links {
      position: relative;
      display: block;
      width: min(100%, 500px);
      min-height: 312px;
      overflow: hidden;
      contain: layout paint style;
      transition: height 220ms ease;
    }

    .links-track {
      display: grid;
      will-change: transform;
      transform: translateZ(0);
      transition: transform 120ms linear;
    }

    .links-track.is-settling {
      transition-duration: 520ms;
      transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
    }

    .link-page {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-content: start;
      gap: 9px;
      width: 100%;
      contain: layout paint style;
    }

    .link {
      display: grid;
      grid-column: 1 / -1;
      grid-template-columns: 52px 1fr 34px;
      align-items: center;
      min-height: 68px;
      padding: 10px 14px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .link:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.22);
    }

    .link--primary {
      grid-template-columns: 1fr auto 32px;
      min-height: 78px;
      padding: 16px 18px;
      border-color: color-mix(in srgb, var(--accent) 72%, white 18%);
      background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 38%, transparent), rgba(255, 255, 255, 0.18));
    }

    .link--mini {
      grid-column: auto;
      grid-template-columns: 36px 1fr;
      min-height: 50px;
      padding: 8px 10px;
    }

    .link--mini .link__action {
      display: none;
    }

    .link--mini .link__label {
      font-size: 0.86rem;
      line-height: 1.1;
    }

    .link--mini .link__meta {
      display: none;
    }

    .link__icon {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.34);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
    }

    .link--mini .link__icon {
      width: 32px;
      height: 32px;
      border-radius: 7px;
    }

    .link__icon svg {
      width: 24px;
      height: 24px;
    }

    .link__icon--instagram {
      border-color: rgba(255, 255, 255, 0.48);
      background: radial-gradient(circle at 30% 105%, #ffd76f 0 18%, #f56040 36%, #c13584 62%, #833ab4 80%, #405de6 100%);
      color: #fff;
    }

    .link__icon--tiktok {
      border-color: rgba(255, 255, 255, 0.42);
      background: #050505;
      color: #fff;
    }

    .link__icon--youtube {
      border-color: rgba(255, 255, 255, 0.38);
      background: #ff0033;
      color: #fff;
    }

    .link__icon--hub,
    .link__icon--gallery,
    .link__icon--star,
    .link__icon--discord {
      border-color: color-mix(in srgb, var(--accent) 54%, white 20%);
      background: rgba(0, 0, 0, 0.18);
    }

    .link__label {
      display: block;
      font-size: 1.08rem;
      font-weight: 750;
      line-height: 1.18;
    }

    .link__meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.25;
    }

    .link__action {
      color: rgba(255, 255, 255, 0.9);
    }

    .link__button {
      display: inline-grid;
      min-width: 132px;
      min-height: 46px;
      place-items: center;
      border-radius: 999px;
      color: #101010;
      background: #fff2d0;
      font-weight: 800;
    }

    .lock {
      display: inline-flex;
      margin-left: 6px;
      vertical-align: -2px;
    }

    .link-tease {
      display: grid;
      grid-column: 1 / -1;
      gap: 8px;
      justify-items: center;
      margin-top: 2px;
    }

    .link-gate {
      display: grid;
      grid-template-columns: 1fr 54px;
      align-items: center;
      width: min(100%, 360px);
      min-height: 70px;
      padding: 10px 12px 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .link-gate:hover,
    .link-gate:focus-visible {
      border-color: var(--accent);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08));
      transform: translateY(-1px);
      outline: none;
    }

    .link-gate--static {
      cursor: default;
    }

    .link-gate__rail {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 8px;
    }

    .link-gate__rail .link__icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
    }

    .link-gate__rail .link__icon svg {
      width: 19px;
      height: 19px;
    }

    .link-gate__arrow {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 68%, white 18%);
      border-radius: 50%;
      color: #121212;
      background: var(--accent);
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.3);
      animation: arrowBob 1.7s ease-in-out infinite;
    }

    .link-gate__arrow svg {
      width: 28px;
      height: 28px;
    }

    .link--peek {
      grid-column: 1 / -1;
      width: min(100%, 500px);
      max-height: 0;
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: max-height 220ms ease, min-height 220ms ease, padding 220ms ease, opacity 180ms ease, transform 220ms ease;
    }

    .link-tease:hover .link--peek,
    .link-tease:focus-within .link--peek,
    .link-tease.is-peeking .link--peek {
      max-height: 72px;
      min-height: 60px;
      padding-top: 9px;
      padding-bottom: 9px;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    @keyframes arrowBob {
      0%, 100% {
        transform: translateY(-3px);
      }

      50% {
        transform: translateY(5px);
      }
    }

    .footer {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      min-height: 90px;
      pointer-events: auto;
    }

    .stage-tabs {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 36px;
      height: 6px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.28);
      cursor: pointer;
    }

    .dot.is-active {
      background: var(--accent);
    }

    .age {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 0.86rem;
      line-height: 1.2;
      text-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    }

    .age__badge {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: #fff;
      background: rgba(0, 0, 0, 0.24);
      font-size: 0.78rem;
      font-weight: 800;
    }

    .scroll-space {
      position: relative;
      height: 360vh;
      pointer-events: none;
    }

    .fallback-note {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 20;
      display: none;
      width: min(92vw, 580px);
      transform: translateX(-50%);
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.86);
      background: rgba(0, 0, 0, 0.72);
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .has-missing-assets .fallback-note {
      display: block;
    }

    @media (max-width: 760px) {
      .shell {
        padding: 18px;
      }

      .topbar {
        align-items: start;
      }

      .mark__word {
        display: none;
      }

      .design-switcher {
        order: 3;
        position: fixed;
        left: 50%;
        right: auto;
        bottom: 18px;
        width: min(362px, calc(100vw - 28px));
        max-width: calc(100vw - 28px);
        transform: translateX(-50%);
      }

      .menu-button {
        width: 44px;
        height: 44px;
      }

      .content {
        align-self: center;
        padding-top: 16px;
      }

      h1 {
        font-size: 4.2rem;
        max-width: 320px;
      }

      .subtitle {
        max-width: 275px;
        margin-bottom: 28px;
        font-size: 1.12rem;
      }

      .links {
        width: min(100%, 430px);
        gap: 8px;
      }

      .link {
        grid-template-columns: 46px 1fr 28px;
        min-height: 60px;
        padding: 9px 11px;
      }

      .link--primary {
        grid-template-columns: 1fr;
        gap: 10px;
        min-height: 86px;
      }

      .link--mini {
        grid-template-columns: 32px 1fr;
        min-height: 46px;
        padding: 7px 8px;
      }

      .link__icon {
        width: 38px;
        height: 38px;
      }

      .link--mini .link__icon {
        width: 30px;
        height: 30px;
      }

      .link__label {
        font-size: 1rem;
      }

      .link__meta {
        font-size: 0.84rem;
      }

      .link__button {
        width: 100%;
        min-width: 0;
      }

      .footer {
        padding-bottom: 58px;
      }

      .link-gate {
        grid-template-columns: 1fr 48px;
        width: min(100%, 318px);
        min-height: 62px;
        padding: 8px 10px 8px 12px;
      }

      .link-gate__rail {
        gap: 6px;
      }

      .link-gate__rail .link__icon {
        width: 30px;
        height: 30px;
      }

      .link-gate__arrow {
        width: 40px;
        height: 40px;
      }

      .age {
        max-width: 190px;
        font-size: 0.78rem;
      }
    }

    @media (max-width: 420px) {
      .shell {
        padding: 14px;
      }

      h1 {
        font-size: 3.55rem;
      }

      .subtitle {
        font-size: 1rem;
      }

      .link {
        min-height: 56px;
      }

      .link--mini {
        min-height: 44px;
      }

      .link-tease:hover .link--peek,
      .link-tease:focus-within .link--peek,
      .link-tease.is-peeking .link--peek {
        max-height: 66px;
        min-height: 56px;
      }
    }

    @media (min-width: 980px) {
      .shell {
        padding-left: 48px;
        padding-right: 48px;
      }

      .content {
        margin-left: min(7vw, 72px);
      }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="stage__poster"></div>
    <video class="stage__video" id="scrollVideo" muted playsinline preload="auto"></video>
    <div class="stage__image is-active" data-layer="0"></div>
    <div class="stage__image" data-layer="1"></div>
    <div class="stage__image" data-layer="2"></div>
    <div class="stage__veil"></div>
  </div>

  <main class="shell">
    <header class="topbar">
      <a class="mark" href="#" aria-label="Jane Voss">
        <svg class="mark__mountain" viewBox="0 0 96 56" fill="none" aria-hidden="true">
          <path d="M7 48 36 12l19 23 12-13 22 26" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M31 48 51 25l16 23" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
        </svg>
        <span class="mark__word">Jane Voss</span>
      </a>

      <div class="design-switcher" role="group" aria-label="Design direction">
        <button type="button" data-design="alpine" aria-pressed="true">Alpine</button>
        <button type="button" data-design="studio" aria-pressed="false">Studio</button>
        <button type="button" data-design="neon" aria-pressed="false">Neon</button>
      </div>

      <button class="menu-button" type="button" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <section class="content" aria-live="polite">
      <div class="eyebrow" id="eyebrow">Public</div>
      <h1 id="headline">Jane Voss</h1>
      <p class="subtitle" id="subtitle">Virtual alpine lifestyle creator.</p>

      <nav class="links" id="links" aria-label="Jane Voss links"></nav>
    </section>

    <footer class="footer">
      <div class="age">
        <span class="age__badge">18+</span>
        <span id="ageText">Public preview. Private access stays gated.</span>
      </div>

      <div class="stage-tabs" aria-label="Scroll stages">
        <button class="dot is-active" type="button" data-stage-jump="0" aria-label="Public stage"></button>
        <button class="dot" type="button" data-stage-jump="1" aria-label="Closer stage"></button>
        <button class="dot" type="button" data-stage-jump="2" aria-label="Private stage"></button>
      </div>
    </footer>
  </main>

  <div class="scroll-space" aria-hidden="true"></div>

  <div class="fallback-note">
    Video or image assets are not available yet. Refresh this page in a moment.
  </div>

  <script>
    const ASSET_ROOT = "homepage_linkhub_lora_set/scroll_preview_start3_magic_lace";
    const VIDEO_ROOT = "homepage_linkhub_lora_set/scroll_video_higgsfield_trimmed";
    const SCROLL_VIDEO = `${VIDEO_ROOT}/jane_scroll_higgsfield_scrub_optimized.mp4`;
    const QA_PARAMS = new URLSearchParams(location.search);
    const FORCE_STATIC = QA_PARAMS.get("static") === "1";
    const PREVIEW_PROGRESS = (() => {
      const preview = QA_PARAMS.get("preview");
      if (preview === null) return null;
      const progress = Math.max(0, Math.min(1, Number(preview)));
      return Number.isFinite(progress) ? progress : null;
    })();
    const VISIBLE_LINK_COUNT = 3;
    const VIDEO_SEEK_MIN_INTERVAL = 68;
    const VIDEO_SEEK_EPSILON = 0.055;
    const DESIGNS = {
      alpine: {
        accent: "#d8c59b",
        soft: "rgba(216, 197, 155, 0.28)",
        title: "Jane Voss",
        video: SCROLL_VIDEO,
        stages: [
          {
            key: "public",
            image: `${ASSET_ROOT}/alpine_public.png`,
            eyebrow: "Public",
            headline: "Jane Voss",
            subtitle: "Virtual alpine lifestyle creator.",
            age: "Public preview. Private access stays gated.",
            links: [
              ["latest", "Latest Adventure", "Fresh trail drop", false],
              ["instagram", "Instagram", "@janevoss", false],
              ["tiktok", "TikTok", "@janevoss", false, false, "mini"],
              ["youtube", "YouTube Shorts", "@janevoss", false, false, "mini"],
              ["hub", "Private Hub", "18+ gallery & videos", true],
              ["gallery", "Gallery", "Preview", true, false, "mini"],
              ["star", "Videos", "Exclusive", true, false, "mini"]
            ]
          },
          {
            key: "closer",
            image: `${ASSET_ROOT}/alpine_closer.png`,
            eyebrow: "Closer",
            headline: "Behind the Adventure",
            subtitle: "More looks. More moments.",
            age: "Preview mode. Member areas stay locked.",
            links: [
              ["camera", "Behind the Scenes", "Exclusive content & stories", true],
              ["hub", "Enter Private Hub", "Unlock full access", true],
              ["instagram", "Instagram", "@janevoss", false],
              ["gallery", "Gallery", "Early edits", true, false, "mini"],
              ["star", "Videos", "Exclusive", true, false, "mini"],
              ["tiktok", "TikTok", "@janevoss", false, false, "mini"],
              ["youtube", "Shorts", "@janevoss", false, false, "mini"]
            ]
          },

    const icons = {

      gallery: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m4 16 4.5-4 4 3.5L15 13l5 4"/><circle cx="9" cy="9" r="1.4"/></svg>',
      star: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg>',
      discord: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M7.5 18.5c-1.6-.5-2.7-1.3-3.5-2.1.2-4.3 1.3-7.6 3.2-9.9 1.3-.5 2.6-.8 3.8-.9l.5 1c.3 0 .7-.1 1-.1s.7 0 1 .1l.5-1c1.2.1 2.5.4 3.8.9 1.9 2.3 3 5.6 3.2 9.9-.8.8-1.9 1.6-3.5 2.1l-1-1.4c-.8.3-1.7.5-2.6.6h-1.8c-.9-.1-1.8-.3-2.6-.6l-1 1.4Z"/><path d="M9.5 13h.01M14.5 13h.01"/></svg>',

    const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const downArrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const lock = '<span class="lock" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>';

    const layers = [...document.querySelectorAll(".stage__image")];
    const videoEl = document.getElementById("scrollVideo");
    const posterEl = document.querySelector(".stage__poster");
    const linksEl = document.getElementById("links");
    const eyebrowEl = document.getElementById("eyebrow");
    const headlineEl = document.getElementById("headline");
    const subtitleEl = document.getElementById("subtitle");
    const ageTextEl = document.getElementById("ageText");
    const dots = [...document.querySelectorAll(".dot")];
    const designButtons = [...document.querySelectorAll("[data-design]")];

    let designKey = "alpine";
    let currentStage = 0;
    let peekedStage = -1;
    let linkTrackEl = null;
    let linkPageStep = 0;
    let lastLinkOffset = null;
    let linkTrackSettling = null;
    let ticking = false;
    let videoReady = false;
    let videoDuration = 0;
    let activeVideoSrc = "";
    let lastVideoSeekAt = 0;
    let lastVideoTargetTime = -1;
    let pendingVideoProgress = 0;
    let trailingVideoSeek = 0;

    function setTheme(design) {
      document.documentElement.style.setProperty("--accent", design.accent);
      document.documentElement.style.setProperty("--accent-soft", design.soft);
    }

    function linkTemplate(item, forcedVariant = "") {
      const [icon, label, meta, locked, primary, variant] = item;
      const mode = forcedVariant || variant;
      const classes = ["link"];
      if (primary && mode !== "peek") classes.push("link--primary");
      if (mode === "mini") classes.push("link--mini");
      if (mode === "peek") classes.push("link--peek");
      const iconClasses = `link__icon link__icon--${icon}`;
      if (primary && mode !== "peek") {
        return `
          <a class="${classes.join(" ")}" href="#" aria-label="${label}">
            <span>
              <span class="link__label">${label}${locked ? lock : ""}</span>
              <span class="link__meta">${meta}</span>
            </span>
            <span class="link__button">Unlock Access</span>
          </a>
        `;
      }
      return `
        <a class="${classes.join(" ")}" href="#" aria-label="${label}">
          <span class="${iconClasses}">${icons[icon] || icons.latest}</span>
          <span>
            <span class="link__label">${label}${locked ? lock : ""}</span>
            <span class="link__meta">${meta}</span>
          </span>
          <span class="link__action">${arrow}</span>
        </a>
      `;
    }

    function iconOnlyTemplate(item) {
      const [icon, label] = item;
      return `<span class="link__icon link__icon--${icon}" role="img" aria-label="${label}" title="${label}">${icons[icon] || icons.latest}</span>`;
    }

    function nextControlTemplate(hiddenLinks, stageIndex) {
      if (!hiddenLinks.length) return "";
      const iconRail = hiddenLinks.slice(0, 5).map(iconOnlyTemplate).join("");
      const hasNextStage = stageIndex < DESIGNS[designKey].stages.length - 1;

      if (!hasNextStage) {
        return `
          <div class="link-tease link-tease--final">
            <div class="link-gate link-gate--static" aria-label="More link previews">
              <span class="link-gate__rail">${iconRail}</span>
            </div>
          </div>
        `;
      }

      return `
        <div class="link-tease">
          <button class="link-gate" type="button" data-next-links aria-expanded="false" aria-label="Scroll to the next links">
            <span class="link-gate__rail">${iconRail}</span>
            <span class="link-gate__arrow">${downArrow}</span>
          </button>
          ${linkTemplate(hiddenLinks[0], "peek")}
        </div>
      `;
    }

    function renderLinks(stage, stageIndex) {
      const visibleLinks = stage.links.slice(0, VISIBLE_LINK_COUNT);
      const hiddenLinks = stage.links.slice(VISIBLE_LINK_COUNT);
      return `${visibleLinks.map((item) => linkTemplate(item, "full")).join("")}${nextControlTemplate(hiddenLinks, stageIndex)}`;
    }

    function renderLinkPages() {
      const design = DESIGNS[designKey];
      linksEl.innerHTML = `
        <div class="links-track">
          ${design.stages.map((stage, index) => `
            <div class="link-page" data-link-page="${index}">
              ${renderLinks(stage, index)}
            </div>
          `).join("")}
        </div>
      `;
      linkTrackEl = linksEl.querySelector(".links-track");
      lastLinkOffset = null;
      linkTrackSettling = null;
      requestAnimationFrame(() => {
        measureLinkPages();
        updateLinkScroll(PREVIEW_PROGRESS ?? scrollProgress(), true);
      });
    }

    function measureLinkPages() {
      const pages = [...linksEl.querySelectorAll(".link-page")];
      if (!pages.length) return;
      pages.forEach((page) => {
        page.style.minHeight = "";
      });

      const maxPageHeight = Math.ceil(Math.max(...pages.map((page) => page.scrollHeight)) + 76);
      linkPageStep = maxPageHeight;
      linksEl.style.height = `${maxPageHeight}px`;
      pages.forEach((page) => {
        page.style.minHeight = `${maxPageHeight}px`;
      });
    }

    function linkScrollIndex(progress) {
      const maxIndex = Math.max(0, DESIGNS[designKey].stages.length - 1);
      return Math.max(0, Math.min(maxIndex, (progress / 0.88) * maxIndex));
    }

    function updateLinkScroll(progress, immediate = false) {
      if (!linkTrackEl || !linkPageStep) return;
      const offset = -linkScrollIndex(progress) * linkPageStep;
      const shouldSettle = !immediate;

      if (linkTrackSettling !== shouldSettle) {
        linkTrackEl.classList.toggle("is-settling", shouldSettle);
        linkTrackSettling = shouldSettle;
      }

      if (lastLinkOffset !== null && Math.abs(offset - lastLinkOffset) < 0.35) return;

      lastLinkOffset = offset;
      linkTrackEl.style.transform = `translate3d(0, ${offset.toFixed(2)}px, 0)`;
    }

    function preloadImages() {
      let missing = 0;
      Object.values(DESIGNS).flatMap((design) => design.stages).forEach((stage) => {
        const img = new Image();
        img.onerror = () => {
          missing += 1;
          if (missing > 0) document.body.classList.add("has-missing-assets");
        };
        img.onload = () => {
          if (missing === 0) document.body.classList.remove("has-missing-assets");
        };
        img.src = stage.image;
      });
    }

    function setVideoSource(design) {
      const stage = design.stages[0];
      posterEl.style.setProperty("--poster", `url("${stage.image}")`);
      videoEl.poster = stage.image;

      if (!design.video || FORCE_STATIC) {
        videoReady = false;
        activeVideoSrc = "";
        lastVideoTargetTime = -1;
        window.clearTimeout(trailingVideoSeek);
        videoEl.removeAttribute("src");
        document.body.classList.remove("video-ready");
        return;
      }

      if (activeVideoSrc === design.video) return;

      videoReady = false;
      videoDuration = 0;
      activeVideoSrc = design.video;
      lastVideoSeekAt = 0;
      lastVideoTargetTime = -1;
      window.clearTimeout(trailingVideoSeek);
      document.body.classList.remove("video-ready");
      videoEl.src = design.video;
      videoEl.load();
    }

    function applyDesignImages() {
      const design = DESIGNS[designKey];
      design.stages.forEach((stage, index) => {
        layers[index].style.setProperty("--image", `url("${stage.image}")`);
      });
      setVideoSource(design);
    }

    function renderStage(index) {
      const design = DESIGNS[designKey];
      const stage = design.stages[index];
      currentStage = index;
      peekedStage = -1;

      layers.forEach((layer, layerIndex) => {
        layer.classList.toggle("is-active", layerIndex === index);
      });
      dots.forEach((dot, dotIndex) => {
        dot.classList.toggle("is-active", dotIndex === index);
      });

      eyebrowEl.textContent = stage.eyebrow;
      headlineEl.textContent = stage.headline;
      subtitleEl.textContent = stage.subtitle;
      ageTextEl.textContent = stage.age;
      posterEl.style.setProperty("--poster", `url("${stage.image}")`);
    }

    function scrollProgress() {
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      return Math.max(0, Math.min(1, scrollY / maxScroll));
    }

    function stageFromProgress(progress) {
      if (progress < 0.36) return 0;
      if (progress < 0.69) return 1;
      return 2;
    }

    function syncVideo(progress, force = false) {
      if (!videoReady || !videoDuration || designKey !== "alpine") return;
      pendingVideoProgress = progress;

      const targetTime = Math.max(0, Math.min(videoDuration - 0.02, progress * videoDuration));
      if (!Number.isFinite(targetTime)) return;

      const now = performance.now();
      const referenceTime = lastVideoTargetTime >= 0 ? lastVideoTargetTime : videoEl.currentTime;
      const delta = Math.abs(referenceTime - targetTime);

      if (!force) {
        if (delta < VIDEO_SEEK_EPSILON) return;
        if (now - lastVideoSeekAt < VIDEO_SEEK_MIN_INTERVAL || videoEl.seeking) {
          window.clearTimeout(trailingVideoSeek);
          trailingVideoSeek = window.setTimeout(() => syncVideo(pendingVideoProgress, true), VIDEO_SEEK_MIN_INTERVAL);
          return;
        }
      }

      window.clearTimeout(trailingVideoSeek);
      lastVideoSeekAt = now;
      lastVideoTargetTime = targetTime;
      videoEl.currentTime = targetTime;
    }

    function updateFromScroll() {
      ticking = false;
      const progress = PREVIEW_PROGRESS ?? scrollProgress();
      syncVideo(progress, PREVIEW_PROGRESS !== null);
      updateLinkScroll(progress, true);
      const nextStage = stageFromProgress(progress);
      if (nextStage !== currentStage) {
        renderStage(nextStage);
      }
    }

    function jumpToStage(index) {
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      const targets = [0.02, 0.49, 0.88];
      window.scrollTo({ top: maxScroll * targets[index], behavior: "smooth" });
      updateLinkScroll(targets[index] || 0, false);
    }

    function peekNextLinks(gate) {
      const tease = gate.closest(".link-tease");
      if (!tease) return;
      tease.classList.add("is-peeking");
      gate.setAttribute("aria-expanded", "true");

      if (PREVIEW_PROGRESS !== null || peekedStage === currentStage) return;

      const stagePeekLimits = [0.34, 0.67, 0.98];
      const currentProgress = scrollProgress();
      const nextProgress = Math.min(currentProgress + 0.12, stagePeekLimits[currentStage] || 0.98);
      if (nextProgress <= currentProgress + 0.006) return;

      peekedStage = currentStage;
      const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
      window.scrollTo({ top: maxScroll * nextProgress, behavior: "smooth" });
      updateLinkScroll(nextProgress, false);
    }

    function applyInitialProgressFromQuery() {
      if (PREVIEW_PROGRESS !== null) {
        requestAnimationFrame(() => {
          syncVideo(PREVIEW_PROGRESS, true);
          renderStage(stageFromProgress(PREVIEW_PROGRESS));
        });
        return;
      }

      const value = QA_PARAMS.get("progress");
      if (value === null) return;
      const progress = Math.max(0, Math.min(1, Number(value)));
      if (!Number.isFinite(progress)) return;
      requestAnimationFrame(() => {
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - innerHeight);
        window.scrollTo({ top: maxScroll * progress, behavior: "auto" });
        updateFromScroll();
      });
    }

    function selectDesign(nextDesign) {
      designKey = nextDesign;
      setTheme(DESIGNS[designKey]);
      applyDesignImages();
      renderLinkPages();
      designButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.design === nextDesign));
      });
      renderStage(currentStage);
      updateFromScroll();
    }

    designButtons.forEach((button) => {
      button.addEventListener("click", () => selectDesign(button.dataset.design));
    });

    dots.forEach((button) => {
      button.addEventListener("click", () => jumpToStage(Number(button.dataset.stageJump)));
    });

    linksEl.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      const gate = target?.closest("[data-next-links]");
      if (!gate) return;
      event.preventDefault();
      const nextStage = Math.min(DESIGNS[designKey].stages.length - 1, currentStage + 1);
      jumpToStage(nextStage);
    });

    linksEl.addEventListener("pointerover", (event) => {
      if (event.pointerType && event.pointerType !== "mouse") return;
      const target = event.target instanceof Element ? event.target : null;
      const gate = target?.closest("[data-next-links]");
      if (!gate) return;
      peekNextLinks(gate);
    });

    linksEl.addEventListener("focusin", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      const gate = target?.closest("[data-next-links]");
      if (!gate) return;
      peekNextLinks(gate);
    });

    videoEl.addEventListener("loadedmetadata", () => {
      videoDuration = videoEl.duration || 0;
      videoReady = videoDuration > 0 && designKey === "alpine";
      document.body.classList.toggle("video-ready", videoReady);
      videoEl.pause();
      updateFromScroll();
    });

    videoEl.addEventListener("error", () => {
      videoReady = false;
      document.body.classList.remove("video-ready");
    });

    document.addEventListener("scroll", () => {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(updateFromScroll);
      }
    }, { passive: true });

    setTheme(DESIGNS[designKey]);
    applyDesignImages();
    renderLinkPages();
    renderStage(0);
    preloadImages();
    applyInitialProgressFromQuery();
  </script>
